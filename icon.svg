<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="pink" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff2d55" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ff2d55" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blue" cx="65%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple" cx="45%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#bf5af2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orange" cx="70%" cy="65%" r="68%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#64d2ff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="white" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <rect width="180" height="180" rx="38" ry="38" fill="#000000" />

  <g filter="url(#soft)">
    <circle cx="70" cy="66" r="52" fill="url(#pink)" />
    <circle cx="114" cy="72" r="54" fill="url(#blue)" />
    <circle cx="86" cy="114" r="56" fill="url(#purple)" />
    <circle cx="120" cy="108" r="44" fill="url(#orange)" />
    <circle cx="90" cy="90" r="42" fill="url(#cyan)" />
    <circle cx="82" cy="78" r="26" fill="url(#white)" />
  </g>

  <circle cx="90" cy="90" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
</svg>
